<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/emblem-light.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <title>TanStack Pacer | Alpine queue</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="app" x-data="devtools">
      <div>
        <div x-data="counter">
          <h1>TanStack Pacer queue Example 1</h1>
          <table>
            <tbody>
              <tr>
                <td>Queue Size:</td>
                <td x-text="(queueItems.length)"></td>
              </tr>
              <tr>
                <td>Items Processed:</td>
                <td x-text="(processedCount)"></td>
              </tr>
              <tr>
                <td>Queue Items:</td>
                <td x-text="(queueItems.join(', '))"></td>
              </tr>
            </tbody>
          </table>
          <button
            @click="((() => {
    const nextNumber = queueItems.length
        ? queueItems[queueItems.length - 1] + 1
        : 1;
    queueItem(nextNumber);
}))($event)"
            :disabled="(queueItems.length >= 25)"
          >
            Add Number
          </button>
        </div>
        <hr />
        <div x-data="search">
          <h1>TanStack Pacer queue Example 2</h1>
          <div>
            <input
              type="search"
              :value="(inputText)"
              @input="((handleInputChange))($event)"
              placeholder="Type to add to queue..."
              :style="({ width: '100%' })"
            />
          </div>
          <table>
            <tbody>
              <tr>
                <td>Queued Text:</td>
                <td x-text="(queuedText)"></td>
              </tr>
              <tr>
                <td>Queue Size:</td>
                <td x-text="(queueItems.length)"></td>
              </tr>
              <tr>
                <td>Items Processed:</td>
                <td x-text="(processedCount)"></td>
              </tr>
              <tr>
                <td>Queue Items:</td>
                <td x-text="(queueItems.join(', '))"></td>
              </tr>
            </tbody>
          </table>
        </div>
        <hr />
        <div x-data="range">
          <h1>TanStack Pacer queue Example 3</h1>
          <div :style="({ marginBottom: '20px' })">
            <label
              >Current Range:<input
                type="range"
                min="0"
                max="100"
                :value="(currentValue)"
                @input="((handleRangeChange))($event)"
                :style="({ width: '100%' })" /><span
                x-text="(currentValue)"
              ></span
            ></label>
          </div>
          <div :style="({ marginBottom: '20px' })">
            <label
              >Queued Range (Readonly):<input
                type="range"
                min="0"
                max="100"
                :value="(queuedValue)"
                disabled
                :style="({ width: '100%' })" /><span
                x-text="(queuedValue)"
              ></span
            ></label>
          </div>
          <table>
            <tbody>
              <tr>
                <td>Queue Size:</td>
                <td x-text="(queueItems.length)"></td>
              </tr>
              <tr>
                <td>Items Processed:</td>
                <td x-text="(processedCount)"></td>
              </tr>
              <tr>
                <td>Queue Items:</td>
                <td x-text="(queueItems.join(', '))"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
